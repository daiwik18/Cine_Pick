*{box-sizing:border-box;margin:0;padding:0}

body{

header{

.logo{

}

header p{color:#aaa;font-size:13px}

main{padding:35px 7%;min-height:75vh}

.hero{margin-bottom:30px}

.hero h1{font-size:35px;margin-bottom:12px}
.hero h1 span{color:#d6b46a}
.hero p{color:#aaa;line-height:1.7}

.controls{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:12px;

}

input,select{
 width:100%;
 padding:14px;
 border:1px solid #51432e;
 background:#1d1d1d;
 color:#fff;
 border-radius:7px;
 font-size:14px;
}

button{
 background:#c5a45e;
 color:#111;
 border:none;
 border-radius:6px;
 padding:12px 16px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#e3c47d}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:12px;
 margin:30px 0 20px;
}

.section-head h2{font-size:23px}

#message{
 color:#c5a45e;
 margin-bottom:20px;
 font-size:14px;
}

#movieGrid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
 gap:18px;
}

.card{
 background:#1b1b1b;
 border:1px solid #393027;
 border-radius:10px;
 padding:20px;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#c5a45e;
}

.badge{
 display:inline-block;
 color:#d6b46a;
 background:#30291e;
 padding:5px 9px;
 border-radius:4px;
 font-size:11px;
 margin-bottom:12px;
}

.card h3{
 font-size:18px;
 color:#e4c47d;
 margin-bottom:9px;
}

.card p{
 color:#aaa;
 font-size:13px;
 line-height:1.6;
 margin:5px 0;
}

.card button{
 width:100%;
 margin-top:14px;
}

footer{
 text-align:center;
 padding:30px;
 border-top:1px solid #393027;
 color:#777;
 margin-top:40px;
 font-size:13px;
}

@media(max-width:600px){
 main{padding:25px 5%}
 .hero h1{font-size:27px}
 header{padding:25px 5%}
}
</style>

    /* DISPLAY MOVIES */

const grid=document.getElementById("movieGrid");
const message=document.getElementById("message");
const searchInput=document.getElementById("searchInput");
const industryFilter=document.getElementById("industryFilter");
const genreFilter=document.getElementById("genreFilter");

function display(list){

 if(!list.length){
  grid.innerHTML="";
  message.textContent="No matching movies found.";
  return;
 }

 message.textContent="Showing "+list.length+" movies.";

 grid.innerHTML=list.map(movie=>{
  const index=movies.indexOf(movie);

  return `
   <div class="card">
    <span class="badge">${movie.industry}</span>
    <h3>${movie.title}</h3>
    <p>${movie.year}</p>
    <p>${movie.genres.join(" • ")}</p>
    <p>${movie.actors.join(", ")}</p>
    <button data-index="${index}">Find Similar</button>
   </div>
  `;
 }).join("");

 grid.querySelectorAll("button").forEach(button=>{
  button.addEventListener("click",()=>{
   recommend(Number(button.dataset.index));
  });
 });
}

/* TF-IDF */

function tokenize(movie){

 return [
  movie.title,
  movie.genres.join(" "),
  movie.keywords.join(" "),
  movie.actors.join(" "),
  movie.industry,
  movie.franchise
 ].join(" ").toLowerCase().match(/[a-z0-9]+/g)||[];
}

const documents=movies.map(tokenize);
const documentFrequency={};

documents.forEach(words=>{
 const unique=new Set(words);

 unique.forEach(word=>{
  documentFrequency[word]=(documentFrequency[word]||0)+1;
 });
});

function createVector(words){

 const vector={};
 const counts={};

 words.forEach(word=>{
  counts[word]=(counts[word]||0)+1;
 });

 const total=words.length||1;

 for(const word in counts){
  const tf=counts[word]/total;
  const idf=Math.log(
   (movies.length+1)/(documentFrequency[word]+1)
  )+1;

  vector[word]=tf*idf;
 }

 return vector;
}

const vectors=documents.map(createVector);

/* COSINE SIMILARITY */

function cosine(a,b){

 let dot=0,na=0,nb=0;

 for(const word in a){
  dot+=a[word]*(b[word]||0);
  na+=a[word]**2;
 }

 for(const word in b){
  nb+=b[word]**2;
 }

 const denominator=Math.sqrt(na)*Math.sqrt(nb);

 return denominator?dot/denominator:0;
}

/* RECOMMENDATION ENGINE */

function recommend(index){

 const selected=movies[index];

 if(!selected)return;

 const results=movies.map((movie,i)=>{

  if(i===index)return null;

  const sharedGenres=movie.genres.filter(
   genre=>selected.genres.includes(genre)
  ).length;

  const sharedKeywords=movie.keywords.filter(
   keyword=>selected.keywords.includes(keyword)
  ).length;

  const sameFranchise=
   selected.franchise!=="Standalone" &&
   selected.franchise===movie.franchise;

  const similarity=cosine(vectors[index],vectors[i]);

  const score=
   sharedGenres*5+
   sharedKeywords*1.5+
   similarity*10+
   (sameFranchise?15:0);

  return {movie,score};

 }).filter(item=>item&&item.score>0)
   .sort((a,b)=>b.score-a.score)
   .slice(0,5);

 document.getElementById("sectionTitle").textContent=
  "Because You Watched: "+selected.title;

 document.getElementById("backButton").style.display="inline-block";

 display(results.map(item=>item.movie));

 if(results.length){
  message.textContent="Top "+results.length+
   " recommendations based on movie similarity.";
 }
}

/* GENRE FILTER */

const allGenres=[...new Set(
 movies.flatMap(movie=>movie.genres)
)].sort();

allGenres.forEach(genre=>{
 const option=document.createElement("option");
 option.value=genre;
 option.textContent=genre;
 genreFilter.appendChild(option);
});

/* SEARCH AND FILTER */

function applyFilters(){

 const query=searchInput.value.toLowerCase().trim();
 const industry=industryFilter.value;
 const genre=genreFilter.value;

 const filtered=movies.filter(movie=>{

  const content=[
   movie.title,
   movie.actors.join(" "),
   movie.genres.join(" "),
   movie.keywords.join(" "),
   movie.industry,
   movie.franchise
  ].join(" ").toLowerCase();

  return content.includes(query) &&
   (industry==="All"||movie.industry===industry) &&
   (genre==="All"||movie.genres.includes(genre));
 });

 document.getElementById("sectionTitle").textContent="Movie Collection";
 document.getElementById("backButton").style.display="none";

 display(filtered);
}

searchInput.addEventListener("input",applyFilters);
industryFilter.addEventListener("change",applyFilters);
genreFilter.addEventListener("change",applyFilters);

/* SHOW ALL */

function showAll(){

 searchInput.value="";
 industryFilter.value="All";
 genreFilter.value="All";

 document.getElementById("sectionTitle").textContent="Explore Movies";
 document.getElementById("backButton").style.display="none";

 display(movies);
}

/* INITIAL LOAD */

display(movies);

</script>
