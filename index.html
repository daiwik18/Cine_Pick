function tokenize(movie){
    return [
        movie.title,
        movie.genres.join(" "),
        movie.keywords.join(" "),
        movie.overview,
        movie.actors?.join(" ") || "",
        movie.industry || "",
        movie.franchise || ""
    ].join(" ").toLowerCase().match(/[a-z]+/g) || [];
}
return (movie.title+" "+movie.genres.join(" ")+" "+movie.keywords.join(" ")+" "+movie.overview)
.toLowerCase().match(/[a-z]+/g)||[];
}

function tfidf(){
const docs=movies.map(tokenize);
const vocab=[...new Set(docs.flat())];
const N=docs.length;

return docs.map(doc=>{
const vector={};
vocab.forEach(word=>{
const tf=doc.filter(w=>w===word).length/doc.length;
const df=docs.filter(d=>d.includes(word)).length;
const idf=Math.log((N+1)/(df+1))+1;
vector[word]=tf*idf;
});
return vector;
});
}

const vectors=tfidf();

function cosine(a,b){
let dot=0,na=0,nb=0;
for(const word in a){
dot+=a[word]*(b[word]||0);
na+=a[word]**2;
}
for(const word in b)nb+=b[word]**2;
return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

function display(list){
document.getElementById("movieGrid").innerHTML=list.map(m=>`
<div class="card">
<h3>${m.title}</h3>
<p>${m.year}</p>
<p>${m.genres.join(" • ")}</p>
<button onclick="recommend('${m.title}')">Find Similar</button>
</div>`).join("");
}

function recommend(title){
    const index = movies.findIndex(m => m.title === title);
    if(index < 0) return;

    const results = movies
        .map((m, i) => ({
            movie: m,
            score: cosine(vectors[index], vectors[i])
        }))
        .filter((item, i) => i !== index && item.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

    display(results.map(item => item.movie));
}
.filter(x=>x.movie.title!==title)
.sort((a,b)=>b.score-a.score);

document.getElementById("recommendations").innerHTML=`
<h2>Recommended for ${title}</h2>
<div class="grid">
${results.map(x=>`
<div class="card">
<h3>${x.movie.title}</h3>
<p>${x.movie.year}</p>
<p>${x.movie.genres.join(" • ")}</p>
<p>Similarity: ${(x.score*100).toFixed(1)}%</p>
</div>`).join("")}
</div>`;
document.getElementById("recommendations").scrollIntoView({behavior:"smooth"});
}

function searchMovies(){
const q=document.getElementById("query").value.toLowerCase().trim();
const results=movies.filter(m=>
m.title.toLowerCase().includes(q)||
m.genres.join(" ").toLowerCase().includes(q)||
m.overview.toLowerCase().includes(q)
);
display(results);
document.getElementById("status").textContent=results.length+" movies found";
}

document.getElementById("query").addEventListener("keydown",e=>{
if(e.key==="Enter")searchMovies();
});

display(movies);
document.getElementById("status").textContent=movies.length+" movies available";
